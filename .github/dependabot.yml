version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "Saphri"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Saphri"
    # Stay on Quarkus 3.x until the extension is explicitly migrated to Quarkus 4.
    ignore:
      - dependency-name: "io.quarkus:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "Saphri"
